<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EdwardZeroV2</title>

    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="app">

        <header class="header">

            <nav class="tabs" aria-label="Navegação principal">

                <button class="tab active" data-page="about">Sobre</button>
                <button class="tab" data-page="projects">Projetos</button>
                <button class="tab" data-page="homelab">HomeLab</button>

            </nav>

            <label class="theme-picker" for="theme-picker">
                <span>Tema</span>
                <select id="theme-picker" aria-label="Escolher tema">
                    <option value="monoyou">MonoYou</option>
                    <option value="monoyou-warm">MonoYou Warm</option>
                    <option value="monoyou-cold">MonoYou Cold</option>
                </select>
            </label>

            <div class="tray">
                <span class="net" title="Este site roda na EltenThor">EltenThor</span>
                <time class="clock" id="clock">--:--</time>
            </div>

        </header>

        <main class="content">

            <section class="page" id="page"></section>

        </main>

    </div>

    <script src="js/main.js"></script>

</body>

</html>
